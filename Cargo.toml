[workspace]
resolver = "3"
members = ["crates/orrery-core", "crates/orrery-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.92"
bollard = "0.21.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
dirs = "7.0.0"
futures-util = "0.3.34"
keyring-core = "1.0.1"
linux-keyutils-keyring-store = "1.0.0"
orrery-core = { version = "0.1.0", path = "crates/orrery-core" }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "macros", "rt", "process", "io-util", "time"] }
tokio-util = "0.7.20"
toml = "1.1.5"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

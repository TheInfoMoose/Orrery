[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # chrono is unmaintained (all versions; no safe upgrade). It is also a
    # transitive dependency of rmcp 3.9, so migrating orrery-core alone would
    # not clear it. Revisit when rmcp drops chrono. Accepted 2026-11-17.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; also required by rmcp 3.9 with no safe upgrade" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl-sys" },
    { crate = "openssl" },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
